<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A sheet of bubble wrap for short breaks." />
    <meta name="theme-color" content="#14161b" />
    <title>Bubble Wrap</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Bubble Wrap</h1>
      <button type="button" id="mute">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" />
          <path class="slash" d="M16 9l6 6M22 9l-6 6" />
        </svg>
        <span id="mute-label">Sound on</span>
      </button>
    </header>
    <main>
      <p class="counters">
        <span><b id="pops">0</b> popped</span>
        <span>Sheet <b id="sheet-no">1</b></span>
      </p>
      <div id="sheet"></div>
      <p class="hint">
        <span class="hint-touch">Tap a bubble</span>
        <span class="hint-desktop">Click a bubble or press <kbd>Space</kbd></span>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
